# Speaker bios for event organizers. Third person, plain text so they paste cleanly.

short: >-
  Tom Lawrence is the founder of Lawrence Systems and host of its YouTube channel, where more than
  400,000 IT professionals learn networking, open source, storage, and security. He ran an MSP for
  over two decades and now works in community and content at Huntress.

long: >-
  Tom Lawrence has worked in IT since 1995, starting in retail computer repair before becoming a
  sysadmin and then IT director for a transportation company. In 2003 he founded Lawrence Technology
  Services, which he ran as an MSP for more than twenty years.

  He is best known for the Lawrence Systems YouTube channel, where more than 400,000 subscribers
  follow his practical videos on networking, open source, storage, and security, and for the
  Lawrence Systems forums, a community of more than 7,000 members. He consults on infrastructure
  projects such as VMware replacement, storage architecture, and disaster recovery planning.

  Since April 2026, Tom has worked in community and content at Huntress, creating practitioner-focused
  security content for MSPs and IT teams. He speaks on agentic AI security, self-hosting, and open
  source infrastructure. He lives in the Detroit area and rides off-road motorcycles when he is not
  in front of a camera.
