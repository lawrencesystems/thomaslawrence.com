# Speaker bios for event organizers. Third person, plain text so they paste cleanly.

short: >-
  Tom Lawrence is the founder of Lawrence Systems and host of its YouTube channel, which covers
  networking, open source, storage, and security for more than 400,000 subscribers (October 2026). He ran an MSP for
  over two decades and now works in community and content at Huntress.

long: >-
  Tom Lawrence has worked in IT since 1995, starting in retail computer repair before becoming a
  sysadmin and then head of IT at ALPIS, a tier one transportation provider for Ford. In 2003 he founded
  Lawrence Technology Services, now Lawrence Systems, which he ran as an MSP for more than twenty years.
  The Southern Wayne County Regional Chamber named him Small Business Person of the Year in 2013, and he
  completed the Goldman Sachs 10,000 Small Businesses program in 2016.

  He is best known for the Lawrence Systems YouTube channel, which covers networking, open source,
  storage, and security. As of October 2026 it has more than 400,000 subscribers, nearly 1,900 videos,
  and 71 million views. He also runs the Lawrence Systems forums, a community of more than 7,000
  members, and co-hosted the Sunday Morning Linux Review and The Homelab Show podcasts. He consults on infrastructure
  projects such as VMware replacement, storage architecture, and disaster recovery planning.

  Since April 2026, Tom has worked in community and content at Huntress, creating practitioner-focused
  security content for MSPs and IT teams. He has been speaking since 2008, from local chambers of
  commerce and Linux meetups to ConnectWise IT Nation, GrrCON, and every 45Drives Creators Summit, on
  agentic AI security, self-hosting, and open source infrastructure. He lives in the Detroit area and rides off-road motorcycles when he is not
  in front of a camera.
